[tool.poetry]
name = "scaffold-rag"
version = "0.4.0"
description = "Production-grade portfolio scaffolding engine using Hybrid RAG"
authors = ["Youssef Larbi <yousseflarbiprofessional@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
instructor = "^1.3.3"
groq = "^0.9.0"
qdrant-client = "1.10.1"
fastembed = "0.4.2"
httpx = "^0.27.0"

[tool.poetry.group.frontend.dependencies]
streamlit = "^1.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
ruff = "0.15.12"
mypy = "^1.10.0"
ragas = "^0.1.9"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "I"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E731"]
"scripts/*" = ["S101", "E731"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "fastembed.*",
    "grpc.*",
    "instructor.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.services.search.ood_gate",
    "app.services.search.hybrid_search",
]
disable_error_code = ["attr-defined"]