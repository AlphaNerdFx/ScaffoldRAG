services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: scaffold_rag_qdrant
    restart: unless-stopped
    ports:
      # Bound strictly to 127.0.0.1 (Loopback) for security
      - "127.0.0.1:6333:6333"   # REST API & Web Dashboard
      - "127.0.0.1:6334:6334"   # gRPC High-Speed Binary Interface
    volumes:
      # Named volume: Stored natively on Linux ext4, bypassing Windows NTFS
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__LOG_LEVEL=INFO

volumes:
  qdrant_data:
    driver: local