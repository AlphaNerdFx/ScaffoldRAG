version: "3.8"

services:
  # ===========================================================================
  # SERVICE 1: QDRANT (Vector & Inverted Search Storage)
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: scaffold_rag_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST API & Web Dashboard
      - "127.0.0.1:6334:6334"   # gRPC High-Speed Binary Interface
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scaffold_network

  # ===========================================================================
  # SERVICE 2: FASTAPI BACKEND
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scaffold_rag_api
    restart: unless-stopped
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_HTTP_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - QDRANT_COLLECTION_NAME=engineering_blueprints
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - scaffold_network

# =============================================================================
# NETWORKS (Inter-Container Communication)
# =============================================================================
networks:
  scaffold_network:
    driver: bridge

# =============================================================================
# VOLUMES (Persistent Host Storage)
# =============================================================================
volumes:
  qdrant_data:
    driver: local